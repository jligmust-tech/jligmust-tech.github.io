<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>flashtool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    text-decoration: none; color: #eee; transition: background .15s, border-color .15s;

  .item:active { background: #161616; }
  .item .meta { min-width: 0; }
  .item .name { font-size: 16px; font-weight: 600; letter-spacing: .5px; }
  .item .desc { font-size: 12px; color: #777; margin-top: 3px; }

  .foot { margin-top: 32px; padding-top: 16px; border-top: 1px solid #1a1a1a; font-size: 11px; color: #4a4a4a; line-height: 1.8; }

</head>
