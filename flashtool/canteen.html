  ];

  /* 内存状态：不写入任何存储 */
  var state = { stage: "welcome", step: 0, answers: { prefs: [], diet: "none" }, shakeCount: 0, nightMode: false };

  /* 随机 emoji（可爱一点） */
  var EMOJIS = ["🍔", "🍟", "🌮", "🍜", "🍣", "🍕", "🥗", "🍗", "🍚", "🍙", "🥤", "🍦", "☕", "🍱", "🥟", "🌯", "🧋", "🍩", "🍇", "🥩", "🥪", "🌶️"];
  function rndEmoji() { return EMOJIS[Math.floor(Math.random() * EMOJIS.length)]; }
  function restEmoji(id) {
    if (!state.emojiMap) state.emojiMap = {};
    if (!state.emojiMap[id]) state.emojiMap[id] = rndEmoji();
    return state.emojiMap[id];
  }

  /* ========================================================================
     二、时间与营业状态
     ======================================================================== */
  function getNow() { return state.nowOverride ? new Date(state.nowOverride) : new Date(); }

  function parseHM(s) { var p = s.split(":"); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); }

  function isOpenNow(rest, now) {
    var day = now.getDay();
    var weekend = (day === 0 || day === 6);
    var spec = rest.opening_hours[weekend ? "weekend" : "weekday"];
    if (!spec || spec === "CLOSED") return false;
    if (spec === "00:00-24:00") return true;
    var parts = spec.split("-");
    var start = parseHM(parts[0]), end = parseHM(parts[1]);
    var cur = now.getHours() * 60 + now.getMinutes();
    if (end <= start) end += 1440;                 // 跨午夜
    if (cur < start && end > 1440) cur += 1440;    // 凌晨，店于前一晚开门
    return cur >= start && cur < end;
  }

  function isPeak(now) {
    var cur = now.getHours() * 60 + now.getMinutes();
    return (cur >= 735 && cur < 795) || (cur >= 1080 && cur < 1140); // 12:15-13:15 / 18:00-19:00
  }

  function isLateNight(now) {
    var cur = now.getHours() * 60 + now.getMinutes();
    return cur >= 1290 || cur < 120; // 21:30 - 02:00
  }

  function fmtClock(d) { return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
  function fmtDateTime(d) {
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " + fmtClock(d);
  }

  /* ========================================================================
     三、评分引擎
     ======================================================================== */
  function locInfo(value) {
    for (var i = 0; i < LOCATIONS.length; i++) { if (LOCATIONS[i].value === value) return LOCATIONS[i]; }
    return LOCATIONS[0];
  }

  function walkCost(rest, fromLoc) {
    var fromZone = fromLoc.zone;
    var table = ZONE_WALK[fromZone] || {};
    var walk = table[rest.zone] != null ? table[rest.zone] : 8;
    var floors = Math.abs((fromLoc.level || 0) - (LEVEL[rest.elevation] != null ? LEVEL[rest.elevation] : 0));
    return { walk: walk, floors: floors, cost: walk + floors * 1.5 };
  }

  function sDist(rest, fromLoc) {
    var c = walkCost(rest, fromLoc);
    return { value: Math.max(0, 100 - c.cost * 8), walk: c.walk, floors: c.floors };
  }

  function sTime(rest, userTime, peak) {
    var tables = {
      rush: { GRAB_AND_GO: 100, FAST: 70, MEDIUM: 10, SLOW: 0 },
      normal: { GRAB_AND_GO: 100, FAST: 95, MEDIUM: 75, SLOW: 40 },
      relax: { GRAB_AND_GO: 80, FAST: 90, MEDIUM: 95, SLOW: 90 },
      gathering: { GRAB_AND_GO: 70, FAST: 85, MEDIUM: 95, SLOW: 85 }
    };
    var base = (tables[userTime] || tables.normal)[rest.speed_level];
    if (base == null) base = 60;
    var penalty = (peak && rest.crowd_risk === "HIGH") ? 25 : 0;
    return { value: Math.max(0, base - penalty), penalty: penalty };
  }

  function sTaste(rest, prefs) {
    if (!prefs.length) return { value: 75, hit: [] };
    var hit = [];
    prefs.forEach(function (pk) {
      var g = PREFS.filter(function (p) { return p.key === pk; })[0];
      if (!g) return;
      if (rest.cuisine_tags.some(function (t) { return g.tags.indexOf(t) >= 0; })) hit.push(g);
    });
    return { value: (hit.length / prefs.length) * 100, hit: hit };
  }

  function sVibe(rest) {
    var map = { LARGE: 100, MEDIUM: 70, SMALL: 45, NONE: 10 };
    return map[rest.seating_capacity] != null ? map[rest.seating_capacity] : 40;
  }

  function weightsFor(ans) {
    if (ans.time === "gathering") return { dist: 0.10, time: 0.10, taste: 0.30, vibe: 0.50, scene: "聚餐 / 请客 / 约会" };
    if (ans.time === "rush") return { dist: 0.45, time: 0.45, taste: 0.10, vibe: 0.00, scene: "赶时间 (15-20 分钟)" };
    if (parseInt(ans.budget, 10) <= 35) return { dist: 0.20, time: 0.20, taste: 0.50, vibe: 0.10, scene: "低预算 / 省钱模式" };
    return { dist: 0.30, time: 0.25, taste: 0.35, vibe: 0.10, scene: "常规推荐" };
  }

  /* 硬性过滤：营业时间 + 预算 + 特殊饮食 */
  function hardFilter(rest, ans, now) {
    if (!isOpenNow(rest, now)) return "已打烊";
    var max = parseInt(ans.budget, 10);
    if (!isNaN(max) && max < 999 && rest.avg_price > max) return "超预算";
    if (ans.diet === "vegetarian" && rest.dietary.indexOf("VEGETARIAN_FRIENDLY") < 0) return "无素食";
    if (ans.diet === "halal" && rest.dietary.indexOf("HALAL") < 0) return "非清真";
    return null;
  }

  function recommend(ans) {
    var now = getNow();
    var fromLoc = locInfo(ans.location);
    var peak = isPeak(now);
    var W = weightsFor(ans);
    var kept = [], rejected = [];
    DB.forEach(function (rest) {
      var why = hardFilter(rest, ans, now);
      if (why) { rejected.push({ rest: rest, reason: why }); return; }
      var d = sDist(rest, fromLoc), t = sTime(rest, ans.time, peak), taste = sTaste(rest, ans.prefs);
      var vibe = sVibe(rest);
      var score = W.dist * d.value + W.time * t.value + W.taste * taste.value + W.vibe * vibe;
      kept.push({
        rest: rest, score: Math.round(score), scene: W.scene, peak: t.penalty > 0,
        parts: { dist: Math.round(d.value), time: Math.round(t.value), taste: Math.round(taste.value), vibe: Math.round(vibe) },
        walk: d.walk, floors: d.floors, hit: taste.hit
      });
    });
    kept.sort(function (a, b) { return b.score - a.score; });
    return { ranked: kept, rejected: rejected, scene: W.scene, peak: peak, now: now };
  }

  function setProgress(p) { progressFill.style.width = Math.max(0, Math.min(100, p)) + "%"; }

  function renderWelcome() {

  function isStepAnswered(s) {

  function renderQuestion() {

    if (s.type === "choice") {
      Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (btn) {
        btn.addEventListener("click", function () {
          state.answers[s.key] = btn.dataset.value;
          Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (b) {
            b.classList.remove("selected");
            b.querySelector(".mark").textContent = "";
          });
          btn.classList.add("selected");
          btn.querySelector(".mark").textContent = "✓";
          updateNav();
        });
      });
    } else if (s.type === "prefs") {
      Array.prototype.forEach.call(app.querySelectorAll("[data-pref]"), function (btn) {
        btn.addEventListener("click", function () {
          var k = btn.dataset.pref, arr = state.answers.prefs, i = arr.indexOf(k);

    if (!output.ranked.length) {
      html += '<div class="section-title">😵 无匹配结果</div>';
      html += '<div class="empty">当前时段 / 预算 / 饮食条件下暂无餐厅。试试放宽预算或更换饮食要求，或使用下方「随便帮我选」。</div>';
    } else {
      html += '<div class="section-title">🏅 Top ' + Math.min(3, output.ranked.length) + '</div>';
      output.ranked.slice(0, 3).forEach(function (item, idx) {
        html += cardHtml(item, idx + 1);
      });
      if (output.ranked.length > 3) {
        html += '<div class="section-title">🎲 候补</div>';
        output.ranked.slice(3).forEach(function (item) {
          html += '<p class="summary" style="margin-bottom:6px;color:#888;">' + esc(item.rest.name_cn) + ' · ' + item.score + ' 分 · ' + esc(item.rest.zone) + ' ' + esc(item.rest.elevation) + '</p>';
        });
      }
    }

    html += '<div class="section-title">⚖️ 决策依据</div>';
    html += '<p class="summary">权重 = 距离 ' + Math.round(weightsFor(ans).dist * 100) + '% · 速度 ' + Math.round(weightsFor(ans).time * 100) + '% · 口味 ' + Math.round(weightsFor(ans).taste * 100) + '% · 氛围 ' + Math.round(weightsFor(ans).vibe * 100) + '%</p>';
    html += '<p class="summary" style="font-size:12px;color:#777;margin-top:6px;">公式：总分 = W_distance·S_distance + W_time·S_time + W_taste·S_taste + W_vibe·S_vibe</p>';

    html += '<div class="nav">' +
              '<button class="btn ghost" id="restartBtn">🔄 重新选择</button>' +
              '<button class="btn red" id="luckyBtn">🎲 随便帮我选</button>' +
            '</div>';
    html += '<div class="nav"><button class="btn" id="shareBtn">📸 分享截图</button></div>';
    html += '<div class="foot">数据为校园公开信息的静态近似模型 · 营业时间以现场为准<br>💡 仅在本地内存中处理 · 不联网 · 关闭即清空</div>';
    html += '</div>';

    html += shareModalHtml();
    html += birdOverlayHtml();
    app.innerHTML = html;
    animateBars();

    bindShare(output);
    bindCommon();

    document.getElementById("luckyBtn").addEventListener("click", function () {
      state.shakeCount++;
      if (state.shakeCount >= 3) { showRedBird(output); }
      else {
        var open = DB.filter(function (r) { return isOpenNow(r, getNow()); });
        var pick = open.length ? open[Math.floor(Math.random() * open.length)] : DB[0];
        alert("提示：🎲 随便就选它 —— " + restEmoji(pick.id) + " " + pick.name_cn + "。再点 " + (3 - state.shakeCount) + " 次会有惊喜 ✨");
      }
    });
  }

  function cardHtml(item, rank) {
    var r = item.rest;
    var tagHtml = "";
    (item.hit || []).forEach(function (g) { tagHtml += '<span class="tag">命中 ' + esc(g.label) + '</span>'; });
    tagHtml += '<span class="tag">' + esc(r.zone) + ' ' + esc(r.elevation) + '</span>';
    tagHtml += '<span class="tag">$' + r.avg_price + '</span>';
    tagHtml += '<span class="tag">' + esc(SPEED_LABEL[r.speed_level]) + '</span>';
    tagHtml += '<span class="tag">' + esc(SEAT_LABEL[r.seating_capacity]) + '</span>';
    tagHtml += '<span class="tag">' + esc(CROWD_LABEL[r.crowd_risk]) + '</span>';

    var why = "步行约 " + item.walk + " 分钟" + (item.floors ? " · 电梯 " + item.floors + " 层" : "") +
              " · " + SPEED_LABEL[r.speed_level] +
              (item.hit.length ? " · 命中 " + item.hit.map(function (g) { return g.label; }).join("/") : "") +
              (item.peak ? " · 高峰排队 -25" : "");

    return '<div class="card' + (rank === 1 ? " rank1" : "") + '">' +
             '<div class="top"><span class="rank">#' + rank + '</span><span class="score">' + item.score + '<small> /100</small></span></div>' +
             '<div class="name">' + restEmoji(r.id) + ' ' + esc(r.name_cn) + '</div>' +
             '<div class="name-en">' + esc(r.name_en) + '</div>' +
             '<div class="meta">' + tagHtml + '</div>' +
             '<div class="why">' + esc(why) + '</div>' +
             '<div class="bars">' +
               bar("距离", item.parts.dist) + bar("速度", item.parts.time) +
               bar("口味", item.parts.taste) + bar("氛围", item.parts.vibe) +
             '</div>' +
           '</div>';
  }

  function bar(label, v) {
    var w = Math.max(0, Math.min(100, v));
    return '<div class="bar-row"><span class="bar-label">' + label + '</span>' +
           '<span class="bar-track"><span class="bar-fill" data-w="' + w + '"></span></span>' +
           '<span class="bar-val">' + v + '</span></div>';
  }

  /* ---------------- 深夜拯救模式 ---------------- */
  function renderNightMode(now) {
    var open = DB.filter(function (r) { return isOpenNow(r, now); });
    var html = '<div class="res fade">';
    html += '<div class="kicker">🌙 LATE-NIGHT RESCUE MODE</div>';
    html += '<h2 class="h">🌙 深夜拯救计划</h2>';
    html += '<p class="summary">' + fmtDateTime(now) + ' · 已重置硬筛选条件，仅展示深夜营业节点</p>';

    html += '<div class="section-title">🍜 营业中</div>';
    if (open.length) {
      open.forEach(function (r) {
        html += '<div class="card">' +
                  '<div class="name">' + restEmoji(r.id) + ' ' + esc(r.name_cn) + '</div>' +
                  '<div class="name-en">' + esc(r.name_en) + '</div>' +
                  '<div class="meta"><span class="tag">' + esc(r.zone) + ' ' + esc(r.elevation) + '</span>' +
                    '<span class="tag">$' + r.avg_price + '</span>' +
                    '<span class="tag">' + esc(SPEED_LABEL[r.speed_level]) + '</span>' +
                    '<span class="tag">' + esc(r.opening_hours.weekday === "00:00-24:00" ? "24h" : r.opening_hours.weekday) + '</span></div>' +
                '</div>';
      });
    } else {
      html += '<div class="empty">😴 此深夜时段校内堂食基本打烊，建议前往便利店微波热食或外卖交接点。</div>';
    }

    html += '<div class="section-title">🛵 外卖交接点提示</div>';
    html += '<p class="summary">北闸 North Gate · 南闸 South Gate · 各宿舍区门口；深夜取餐注意安全与保暖 🧣</p>';

    html += '<div class="nav"><button class="btn ghost" id="restartBtn">🚪 退出深夜模式</button>' +
            '<button class="btn" id="shareBtn">📸 分享截图</button></div>';
    html += '<div class="foot">🌙 深夜模式 · 本地生成 · 不联网</div>';
    html += '</div>';
    html += shareModalHtml();
    app.innerHTML = html;
    animateBars();

    document.getElementById("restartBtn").addEventListener("click", function () {
      state.nightMode = false; state.stage = "welcome"; state.step = 0; render();
    });
    bindShare({ ranked: [], night: true });
  }

  /* ---------------- Red Bird 彩蛋 ---------------- */
  var BIRD_LINES = [
    "去 LG7 谭仔吧！算上排队时间，刚好能让你思考人生。",
    "红鸟拍板：今天不纠结，吃什么都比饿着强。",
    "命运选择了它——红鸟说，赶时间就别去排队最长的。",
    "别问为什么，问就是红鸟摇的。"
  ];

  function birdOverlayHtml() {
    return '<div class="bird-overlay" id="birdOverlay">' +
             '<div class="bird"><span class="body"></span><span class="wing"></span><span class="beak"></span><span class="eye"></span></div>' +
             '<div class="ttl">🐦 THE RED BIRD SHAKE 🐦</div>' +
             '<div class="pick" id="birdPick">—</div>' +
             '<div class="line" id="birdLine">—</div>' +
             '<button class="btn small" id="birdClose" style="flex:0 0 auto;">😤 接受命运</button>' +
           '</div>';
  }

  function showRedBird(output) {
    var open = DB.filter(function (r) { return isOpenNow(r, getNow()); });
    var pool = open.length ? open : DB;
    var pick = pool[Math.floor(Math.random() * pool.length)];
    var line = BIRD_LINES[Math.floor(Math.random() * BIRD_LINES.length)];
    document.getElementById("birdPick").textContent = restEmoji(pick.id) + " " + pick.name_cn;
    document.getElementById("birdLine").textContent = line;
    document.getElementById("birdOverlay").classList.add("open");
    document.getElementById("birdClose").addEventListener("click", function () {
      document.getElementById("birdOverlay").classList.remove("open");
    });
  }

  /* ---------------- 分享截图 ---------------- */
  function shareModalHtml() {
    return '<div class="modal" id="shareModal">' +
             '<div class="modal-card">' +
               '<div class="modal-head">📸 截图预览 · 含当前时间</div>' +
               '<img class="shot" id="shotImg" alt="食堂推荐截图">' +
               '<div class="modal-actions">' +
                 '<button class="btn ghost small" id="closeShareBtn">✖️ 关闭</button>' +
                 '<button class="btn small" id="saveShotBtn">💾 保存图片</button>' +
                 (canSystemShare() ? '<button class="btn small" id="sysShareBtn">📤 系统分享</button>' : '') +
               '</div>' +
               '<div class="modal-note">图片由本地 Canvas 生成 · 不联网 · 不上传</div>' +
             '</div>' +
           '</div>';
  }

  function bindCommon() {
    document.getElementById("restartBtn").addEventListener("click", function () {
      state = { stage: "welcome", step: 0, answers: { prefs: [], diet: "none" }, shakeCount: 0, nightMode: false };
      render();
      window.scrollTo(0, 0);
    });
  }

  function bindShare(output) {
    var shot = null;
    function ensure() { if (!shot) shot = drawShareCard(output); return shot; }
    document.getElementById("shareBtn").addEventListener("click", function () {
      document.getElementById("shotImg").src = ensure().toDataURL("image/png");
      document.getElementById("shareModal").classList.add("open");
    });
    document.getElementById("closeShareBtn").addEventListener("click", function () {
      document.getElementById("shareModal").classList.remove("open");
    });
    document.getElementById("saveShotBtn").addEventListener("click", function () {
      var link = document.createElement("a");
      link.href = ensure().toDataURL("image/png");
      link.download = "食堂决策_" + fileStamp() + ".png";
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    });
    var sysBtn = document.getElementById("sysShareBtn");
    if (sysBtn) {
      sysBtn.addEventListener("click", function () {
        ensure().toBlob(function (blob) {
          if (!blob) return;
          var file = new File([blob], "食堂决策_" + fileStamp() + ".png", { type: "image/png" });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: "科大食堂决策" }).catch(function () {});
          }
        }, "image/png");
      });
    }
  }

  function wrapLines(ctx, text, maxWidth) {
    var chars = String(text).split(""), out = [], cur = "";
    for (var i = 0; i < chars.length; i++) {
      var test = cur + chars[i];
      if (cur && ctx.measureText(test).width > maxWidth) { out.push(cur); cur = chars[i]; }
      else { cur = test; }
    }
    if (cur) out.push(cur);
    return out;
  }

  function drawShareCard(output) {
    var W = 1080, H = 2600, pad = 80;
    var canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext("2d");
    var FONT = '"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif';
    function font(size, weight) { ctx.font = (weight ? weight + " " : "") + size + "px " + FONT; }
    function txt(str, x, y, size, weight, color) { font(size, weight); ctx.fillStyle = color; ctx.fillText(str, x, y); }
    function center(str, y, size, weight, color) { font(size, weight); ctx.fillStyle = color; ctx.fillText(str, (W - ctx.measureText(str).width) / 2, y); }
    function line(y) { ctx.strokeStyle = "#222"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke(); }

    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = "top";

    var y = 120;
    ctx.fillStyle = "#FFC72C"; ctx.fillRect(pad, y, 120, 6); y += 42;
    txt("🍔 HKUST CATERING DECISION", pad, y, 30, "500", "#FFC72C"); y += 54;
    txt("🍔 科大食堂决策 🍟", pad, y, 60, "700", "#fff"); y += 110;
    txt(fmtDateTime(getNow()), pad, y, 34, "400", "#888"); y += 60;
    line(y); y += 42;

    if (output.night) {
      txt("🌙 深夜拯救计划", pad, y, 44, "700", "#FFC72C"); y += 70;
      var open = DB.filter(function (r) { return isOpenNow(r, getNow()); });
      (open.length ? open : []).forEach(function (r) {
        txt("· " + restEmoji(r.id) + " " + r.name_cn + "  (" + r.zone + " " + r.elevation + ")", pad, y, 34, "400", "#cfcfcf"); y += 52;
      });
      if (!open.length) { txt("· 校内堂食多已打烊，建议便利店 / 外卖交接点", pad, y, 34, "400", "#cfcfcf"); y += 52; }
    } else {
      txt("场景：" + output.scene, pad, y, 34, "400", "#cfcfcf"); y += 60;
      (output.ranked || []).slice(0, 3).forEach(function (item, i) {
        var r = item.rest;
        var nm = "#" + (i + 1) + "  " + restEmoji(r.id) + " " + r.name_cn;
        txt(nm, pad, y, 42, "700", "#fff");
        var sw = ctx.measureText(nm).width;
        txt(String(item.score) + " 分", pad + sw + 24, y + 8, 34, "700", "#FFC72C");
        y += 58;
        txt(r.zone + " " + r.elevation + " · $" + r.avg_price + " · " + SPEED_LABEL[r.speed_level] + " · 步行约 " + item.walk + " 分钟", pad, y, 30, "400", "#9a9a9a"); y += 46;
        if (item.hit && item.hit.length) { txt("命中：" + item.hit.map(function (g) { return g.label; }).join("、"), pad, y, 30, "400", "#9a9a9a"); y += 46; }
        y += 26;
      });
    }

    y += 12;
    center("🍔 本地生成 · 完全离线 · 营业与价格以现场为准", y, 26, "400", "#555");
    y += 64;

    var outH = Math.min(H, y);
    var out = document.createElement("canvas");
    out.width = W; out.height = outH;
    out.getContext("2d").drawImage(canvas, 0, 0, W, outH, 0, 0, W, outH);
    return out;
  }

  /* ========================================================================
     五、工具函数
     ======================================================================== */
  function pad2(n) { return n < 10 ? "0" + n : String(n); }
  function isBlank(v) { return v === undefined || v === null || String(v).trim() === ""; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function fileStamp() {
    var d = new Date();
    return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "_" + pad2(d.getHours()) + pad2(d.getMinutes());
  }
  function canSystemShare() {
    return typeof navigator !== "undefined" && !!navigator.share && !!navigator.canShare &&
           typeof File !== "undefined" && typeof Blob !== "undefined";
  }

  /* 分数条：先以 0 宽插入，再于下一帧写入目标宽度，确保进入结果页即时更新 */
  function animateBars() {
    var bars = app.querySelectorAll(".bar-fill");
    var run = function () {
      Array.prototype.forEach.call(bars, function (b) {
        var w = b.getAttribute("data-w");
        if (w != null) b.style.width = w + "%";
      });
    };
    if (typeof requestAnimationFrame === "function") requestAnimationFrame(run);
    else run();
  }

  render();
})();
</script>
</body>
</html>
