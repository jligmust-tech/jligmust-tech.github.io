  function pts(k, field) { var q = qByKey(k), o = q ? optOf(q, val(k)) : null; return (o && o[field] != null) ? o[field] : 0; }

  function analyze() {
    var ax = pts("att1", "ax") + pts("att2", "ax") + pts("att3", "ax");
    var av = pts("att1", "av") + pts("att2", "av") + pts("att3", "av");
    var hiAx = ax >= 3, hiAv = av >= 3;
    var attachKey = hiAx ? (hiAv ? "fearful" : "anxious") : (hiAv ? "avoidant" : "secure");

    var active = pts("active", "active") + pts("social", "social");
    var spend = pts("spend1", "spend") + pts("ritual", "spend");

    return {
      gender: val("gender"), age: val("age"),
      ax: ax, av: av, attachKey: attachKey, attach: ATTACH[attachKey],
      active: active, spend: spend, spendRaw: pts("spend1", "spend"), ritual: val("ritual"),
      social: val("social"), activePref: val("active"),
      career: val("career"), future: val("future"),
      standards: state.answers.standards || []
    };
  }

  function level3(score) {
    if (score <= 2) return { key: "low", label: "偏低" };
    if (score <= 4) return { key: "mid", label: "中等" };
    return { key: "high", label: "偏高" };
  }

  /* ========================================================================
     三、建议生成
     ======================================================================== */
  var STD_LABEL = { loyal: "忠诚专一", stable: "情绪稳定", values: "三观一致", ambition: "上进心", money: "经济实力", look: "外貌/身材", family: "家庭背景", funny: "幽默有趣" };

  function generateSuggestions(r) {
    var out = [];
    var A = r.attachKey;
    var aLevel = level3(r.active), sLevel = level3(r.spend);

    /* 总评 */
    out.push({ title: "一句话总评", body: "你是「" + r.attach.alias + "」（" + r.attach.name + "）。主动度" + aLevel.label + "，投入度" + sLevel.label + "。核心功课是：用适合你依恋类型的方式去爱，而不是用最用力的方式。", pr: 0 });

    /* 依恋类型核心建议 */
    var attachTip = {
      secure: "你的稳定是稀缺资源。别因为「我很好养」就压抑需求——该要回应时要，该设边界时设。",
      anxious: "你要的是「稳定的回应」，不是「更用力地追」。把「你是不是不爱我了」换成具体的请求（如：忙的时候提前说一声）。先学会自我安抚，别把安全感全部外包。",
      avoidant: "亲密不会吞掉你。想撤退时，试着说「我需要缓一缓，晚点聊」，而不是直接消失——一句话能省掉对方十次胡思乱想。",
      fearful: "又想要又害怕很正常。与其用行为反复试探对方会不会走，不如把害怕直接说出口。找一个「经得起你慢热」的安全型。"
    };
    out.push({ title: "依恋模式的功课", body: attachTip[A], pr: 5 });
    out.push({ title: "适合你的伴侣", body: r.attach.match + " 判断标准很简单：和 TA 相处后，你是更放松，还是更紧绷？", pr: 4 });

    /* 要不要主动 */
    if (aLevel.key === "low") {
      out.push({ title: "要不要主动？——要，而且现在就要", body: "你的主动度和社交接触都偏低。你不是不适合恋爱，是「样本量太小」。给自己定个小 KPI：每周认识 1 个新朋友（不限男女），先从扩圈开始，别一上来就奔着结果。" + (A === "avoidant" ? " 对回避型来说，别拿「随缘」当挡箭牌，主动不是掉价，是提高筛选效率。" : ""), pr: 5 });
    } else if (aLevel.key === "mid") {
      out.push({ title: "要不要主动？——半步主动刚好", body: "你已经有主动的意愿，可以再往前半步：把「暗示」换成「明确的邀约」（具体时间 + 具体事），成功率会明显上升。被拒绝只是过滤，不是否定你。" , pr: 3 });
    } else {
      out.push({ title: "要不要主动？——收一点，重质量", body: "你很敢主动，这是优势。但把力气花在「值得的人」上：先判断对方是否也主动回应，再决定投入多少。避免广撒网式热情撞上不对的人。" + (A === "anxious" ? " 焦虑型尤其注意：主动不等于黏，别用高频联系换安心。" : ""), pr: 3 });
    }

    /* 要不要多花钱买礼物 */
    if (sLevel.key === "low") {
      out.push({ title: "要不要多花钱买礼物？——不必多，但要「有心」", body: "你偏务实，这没什么错。礼物重在匹配对方在意的点，而不是价格：一束当季的花、一顿认真做的饭，往往比贵而无感的礼物有效。设个预算：约会/小礼物约占可支配收入的 5-10%，纪念日单次不超过月可支配的 15%，量力而行。", pr: 4 });
    } else if (sLevel.key === "mid") {
      out.push({ title: "要不要多花钱买礼物？——按阶段，别超前消费", body: "你愿意为喜欢的人花钱，这是加分项。但把投入和关系阶段对齐：暧昧期重体验（一起做件事）而非重礼，稳定后在纪念日适度升级。别用礼物替代表达，也别让花费超过自己的承受线。", pr: 3 });
    } else {
      out.push({ title: "要不要多花钱买礼物？——当心「用钱买安全感」", body: "你投入度高、也重仪式。" + (A === "anxious" || A === "fearful" ? "焦虑/恐惧型最容易用礼物换安心，但越换越不安——先确认对方要的是你，不是你的钱包。" : "这本身很好，但设一条线：单次大额支出不超过月可支配收入的 15%，别超前消费、别借贷示爱。") + " 花钱是匹配度，不是爱的计量单位。", pr: 4 });
    }

    /* 择偶标准分析 */
    var std = r.standards;
    if (std.length) {
      var hard = std.slice(0, 3).map(function (k) { return STD_LABEL[k]; }).join("、");
      var onlyExterior = std.every(function (k) { return k === "look" || k === "money" || k === "family"; });
      var body = "你在意：" + hard + "。把它们分成「必须有 / 最好有 / 锦上添花」三档，只把 1 项列为硬性门槛，其余留弹性——门槛太多会把对的人挡在门外。";
      if (onlyExterior) body += " 小提醒：只有外在/经济条件的关系，日常摩擦时很难扛住，建议至少加一项「情绪稳定」或「三观一致」。";
      out.push({ title: "择偶标准 · 别全设成硬门槛", body: body, pr: 4 });
    } else {
      out.push({ title: "择偶标准 · 先想清楚 3 条", body: "你没选标准，说明还在探索。建议列出「必须有 1 条、最好有 3 条、不能碰 1 条」，在约会时带着问题去观察，而不是凭感觉。", pr: 3 });
    }

    /* 三观 / 未来规划 */
    var careerBody = {
      career: "你偏事业优先。适合找同样有自己节奏、不黏人的伴侣，并提前对齐「陪伴时间」的预期，否则容易被误解为不上心。",
      balance: "你追求平衡。这是好底子，但要和对方明确「忙季怎么分配时间」，平衡是谈出来的，不是默认的。",
      love: "你感情优先。注意别把全部重心压在关系上，保留自己的朋友和爱好——过度投入反而让对方有压力。",
      unsure: "你还在看阶段。那就先在相处中诚实表达你的不确定，别用承诺去换对方的安心。"
    }[r.career];
    var futureBody = {
      bigcity: "你想留大城市打拼。优先认识同样打算长期留下的对象，异地/回流分歧是长期关系里最常见的分手点。",
      hometown: "你想回小城安稳。早点坦白你的规划，别和「一定要留大城市」的人互相耽误。",
      abroad: "你想出国/旅居。适合找有同样流动意愿、或能接受异地的人；提前谈清「谁迁就谁」。",
      unsure: "你未来还没定。保持开放，但要在关系变认真前把大方向聊清楚。"
    }[r.future];
    out.push({ title: "三观与未来 · 先对齐再投入", body: careerBody + " " + futureBody, pr: 3 });

    /* 社交渠道 */
    var socialBody = {
      big: "你圈子大，优势是选择多。别陷入「下一个更好」的错觉——遇到三观合、相处放松的人，值得多给几次机会。",
      mid: "你圈子中等。可以再增加一个「高浓度兴趣场景」（运动队、读书会、志愿活动），比泛泛社交更容易遇到同频的人。",
      small: "你圈子偏小。建议从「熟人介绍 + 一个长期兴趣社群」双线扩展，熟人介绍的成功率和安全感都更高。",
      none: "你几乎零社交。先别急着恋爱，从每周一次线下活动开始重建接触面；线上 App 可用作补充，但别只依赖它。"
    }[r.social];
    out.push({ title: "社交接触范围 · 怎么遇到人", body: socialBody, pr: 3 });

    /* 年龄语境 */
    if (r.age === "28" || r.age === "33") {
      out.push({ title: "关于年龄与节奏", body: "到了会被催的阶段，但别让「年龄焦虑」替你做决定。相比「快点定下来」，明确底线、扩大有效接触面更重要。宁可晚一点，也别在错误的人身上消耗三年。", pr: 2 });
    }

    /* 雷区 */
    var warn;
    if (A === "secure") warn = "别因为太省心而被忽视：遇到不稳定的对象，你可能习惯性当「情绪垃圾桶」。先看对方是否也在为关系努力。";
    else if (A === "anxious") warn = "雷区：把对方的每次冷淡都当成危机、查手机、用分手测试对方。这些只会把安全型也逼成回避型。";
    else if (A === "avoidant") warn = "雷区：用「忙」和「无所谓」推开在意的人、冷处理冲突。沉默在你这儿是保护，在对方那儿是不爱。";
    else warn = "雷区：一边说我想要，一边又把人推开；用忽冷忽热测试忠诚。把需求说清楚，比让对方猜有效十倍。";
    out.push({ title: "你的雷区", body: warn, pr: 2 });

    /* 保证至少 3 条 */
    if (out.length < 3) out.push({ title: "给慢热的人", body: "给自己和对方多一点时间，感情的质量往往和推进速度无关。", pr: 0 });

    var head = out.shift();
    out.sort(function (a, b) { return (b.pr || 0) - (a.pr || 0); });
    return [head].concat(out).slice(0, 8).map(function (x) { return { title: x.title, body: x.body }; });
  }

  /* ========================================================================
     四、渲染
     ======================================================================== */
  var state = { stage: "welcome", step: 0, answers: { standards: [] } };
  var app = document.getElementById("app");
  var progressFill = document.getElementById("progressFill");

  function setProgress(p) { progressFill.style.width = Math.max(0, Math.min(100, p)) + "%"; }

  function render() {
    if (state.stage === "welcome") return renderWelcome();
    if (state.stage === "quiz") return renderQuestion();
    return renderResult();
  }

  function renderWelcome() {
    setProgress(0);
    app.innerHTML =
      '<div class="hero fade">' +
        '<div class="kicker">LOVE & MATCH ADVISOR</div>' +
        '<h1>恋爱择偶建议</h1>' +
        '<div class="en">ATTACHMENT · VALUES · SOCIAL CIRCLE</div>' +
        '<p class="sub">「随缘」这两个字，你可能说了好多年，缘分听了也挺随缘的。</p>' +
        '<p class="sub">这台不插电的小机器，不会替你心动，也变不出对象——<br>它只陪你坐下来，把「我是谁、适合跟谁慢慢磨」聊清楚。 💘</p>' +
        '<p class="sub" style="color:#7c5a68;font-size:13px;">🔒 全程离线：你说的话，连这台机器自己都不记得。</p>' +
        '<div class="note">🧠 <b>它是怎么瞎猜的</b>：靠几个关于相处的小问题，套用公开的大众心理学概念（比如依恋类型）随便推一推。仅供自我了解、图一乐，请以真实相处的感受为准。</div>' +
        '<div class="note" style="border-color:#6b5230;color:#d8b45a;">⚠️ <b>免责声明</b>：本工具非临床诊断、非专业心理咨询，也不是科学结论；它看不懂你，更看不懂你的心动对象。任何决定请自行判断，必要时求助专业人士——毕竟机器不用为你的感情负责，你要。</div>' +
      '</div>' +
      '<div class="nav"><button class="btn" id="startBtn">💌 开始自省（约 3 分钟）</button></div>';
    document.getElementById("startBtn").addEventListener("click", function () { state.stage = "quiz"; state.step = 0; render(); });
  }

  function isAnswered(q) {
    if (q.type === "multi") return (state.answers.standards || []).length > 0;
    return !isBlank(state.answers[q.key]);
  }

  function renderQuestion() {
    var q = QUESTIONS[state.step];
    setProgress(((state.step + 1) / QUESTIONS.length) * 100);

    var html = '<div class="fade">';
    html += '<div class="q-head"><span class="q-no">' + pad2(state.step + 1) + ' / ' + pad2(QUESTIONS.length) + '</span>' +
            '<span class="q-name">' + esc(q.name) + '</span></div>';
    html += '<h2 class="q-title">' + esc(q.question) + '</h2>';
    if (q.hint) html += '<p class="q-hint">' + esc(q.hint) + '</p>';

    if (q.type === "multi") {
      html += '<div class="chips" id="stdChips">';
      q.options.forEach(function (o) {
        var sel = (state.answers.standards || []).indexOf(o.v) >= 0;
        html += '<button class="chip' + (sel ? " selected" : "") + '" data-std="' + o.v + '">' + esc(o.label) + '</button>';
      });
      html += '</div>';
    } else {
      html += '<div class="opts">';
      q.options.forEach(function (o) {
        var sel = state.answers[q.key] === o.v;
        html += '<button class="opt' + (sel ? " selected" : "") + '" data-v="' + o.v + '">' +
                  '<span class="mark">' + (sel ? "✓" : "") + '</span>' +
                  '<span class="txt">' + esc(o.label) + '</span>' +
                '</button>';
      });
      html += '</div>';
    }
    html += '</div>';

    html += '<div class="nav">';
    if (state.step > 0) html += '<button class="btn ghost small" id="prevBtn">⬅️ 上一题</button>';
    html += '<button class="btn" id="nextBtn">' + (state.step === QUESTIONS.length - 1 ? "💘 生成建议" : "➡️ 下一题") + '</button>';
    html += '</div>';

    app.innerHTML = html;

    if (q.type === "multi") {
      Array.prototype.forEach.call(app.querySelectorAll("[data-std]"), function (btn) {
        btn.addEventListener("click", function () {
          var k = btn.dataset.std;
          if (!state.answers.standards) state.answers.standards = [];
          var arr = state.answers.standards, i = arr.indexOf(k);
          if (i >= 0) { arr.splice(i, 1); btn.classList.remove("selected"); }
          else {
            if (arr.length >= 3) { arr.shift(); }
            arr.push(k); btn.classList.add("selected");
            Array.prototype.forEach.call(app.querySelectorAll("[data-std]"), function (b) {
              b.classList.toggle("selected", arr.indexOf(b.dataset.std) >= 0);
            });
          }
          updateNav();
        });
      });
    } else {
      Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (btn) {
        btn.addEventListener("click", function () {
          state.answers[q.key] = btn.dataset.v;
          Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (b) {
            b.classList.remove("selected"); b.querySelector(".mark").textContent = "";
          });
          btn.classList.add("selected"); btn.querySelector(".mark").textContent = "✓";
          updateNav();
        });
      });
    }

    if (state.step > 0) document.getElementById("prevBtn").addEventListener("click", function () { state.step--; render(); });
    document.getElementById("nextBtn").addEventListener("click", function () {
      if (!isAnswered(q)) return;
      if (state.step === QUESTIONS.length - 1) { state.stage = "result"; render(); window.scrollTo(0, 0); }
      else { state.step++; render(); }
    });

    updateNav();
  }

  function updateNav() {
    var btn = document.getElementById("nextBtn");
    if (!btn) return;
    var ok = isAnswered(QUESTIONS[state.step]);
    btn.disabled = !ok;
    btn.classList.toggle("disabled", !ok);
  }

  function genderLabel(g) { return g === "m" ? "男" : g === "f" ? "女" : "保密"; }
  function ageLabel(a) { return ({ "18": "18-22 岁", "23": "23-27 岁", "28": "28-32 岁", "33": "33 岁以上" })[a] || a; }

  function renderResult() {
    setProgress(100);
    var r = analyze();

                '<div class="meter-track"><span class="meter-fill" data-w="' + (r.active / 6 * 100) + '"></span></div>' +
                '<div class="txt">' + (aLevel.key === "low" ? "偏被动，容易错过机会 —— 建议多迈半步。" : aLevel.key === "mid" ? "有主动意愿，再明确一点会更好。" : "很敢主动，注意把力气用在值得的人身上。") + '</div>' +
              '</div>' +
            '</div>';
    html += '<div class="card">' +
              '<div class="meter">' +
                '<div class="top"><span class="lvl">投入度 · ' + sLevel.label + '</span><span class="sc">' + r.spend + '/6</span></div>' +
                '<div class="meter-track"><span class="meter-fill" data-w="' + (r.spend / 6 * 100) + '"></span></div>' +
                '<div class="txt">' + (sLevel.key === "low" ? "偏务实/节俭 —— 不必多花钱，但要有「被在乎」的表达。" : sLevel.key === "mid" ? "愿意投入，按关系阶段对齐节奏即可。" : "很愿意投入 —— 当心用礼物换安全感，设好预算线。") + '</div>' +
              '</div>' +

    html += '<div class="section-title">三观与择偶偏好</div>';
    html += '<div class="card">';

    html += '</div>';
    if (r.standards.length) {
      html += '<div class="tags" style="margin-top:10px;">';
      r.standards.forEach(function (k) { html += '<span class="tag">看重 · ' + esc(STD_LABEL[k]) + '</span>'; });
      html += '</div>';
    }
    html += '</div>';

    html += '<div class="section-title">给你的具体建议</div>';
    sugs.forEach(function (s) {
      html += '<div class="sug"><h4>' + esc(s.title) + '</h4><p>' + esc(s.body) + '</p></div>';

    html += '<div class="nav">' +
              '<button class="btn ghost" id="restartBtn">🔄 重新评估</button>' +
              '<button class="btn" id="shareBtn">📸 分享截图</button>' +
            '</div>';
    html += '<div class="foot">⚠️ 免责声明：依恋类型等仅供自我了解与娱乐，非临床诊断、非专业心理咨询 · 请以真实相处的感受为准<br>数据仅在本地内存中处理 · 不写入任何存储 · 关闭即清空</div>';
    html += '</div>';

    html += '<div class="modal" id="shareModal">' +
              '<div class="modal-card">' +
                '<div class="modal-head">📸 截图预览 · 含当前时间</div>' +
                '<img class="shot" id="shotImg" alt="恋爱择偶建议截图">' +
                '<div class="modal-actions">' +
                  '<button class="btn ghost small" id="closeShareBtn">✖️ 关闭</button>' +
                  '<button class="btn small" id="saveShotBtn">💾 保存图片</button>' +
                  (canSystemShare() ? '<button class="btn small" id="sysShareBtn">📤 系统分享</button>' : '') +
                '</div>' +
                '<div class="modal-note">图片由本地 Canvas 生成 · 不联网 · 不上传</div>' +
              '</div>' +
            '</div>';

    app.innerHTML = html;
    animateBars();

    document.getElementById("restartBtn").addEventListener("click", function () {
      state = { stage: "welcome", step: 0, answers: { standards: [] } }; render(); window.scrollTo(0, 0);
    });

    var shot = null;
    function ensure() { if (!shot) shot = drawShareCard(r, sugs); return shot; }
    document.getElementById("shareBtn").addEventListener("click", function () {
      document.getElementById("shotImg").src = ensure().toDataURL("image/png");
      document.getElementById("shareModal").classList.add("open");
    });
    document.getElementById("closeShareBtn").addEventListener("click", function () {
      document.getElementById("shareModal").classList.remove("open");
    });
    document.getElementById("saveShotBtn").addEventListener("click", function () {
      var link = document.createElement("a");
      link.href = ensure().toDataURL("image/png");
      link.download = "恋爱择偶_" + fileStamp() + ".png";
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    });
    var sysBtn = document.getElementById("sysShareBtn");
    if (sysBtn) {
      sysBtn.addEventListener("click", function () {
        ensure().toBlob(function (blob) {
          if (!blob) return;
          var file = new File([blob], "恋爱择偶_" + fileStamp() + ".png", { type: "image/png" });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: "恋爱择偶建议" }).catch(function () {});
          }
        }, "image/png");
      });
    }
  }

  /* ========================================================================
     五、分享截图
     ======================================================================== */
  function wrapLines(ctx, text, maxWidth) {
    var chars = String(text).split(""), out = [], cur = "";
    for (var i = 0; i < chars.length; i++) {
      var test = cur + chars[i];
      if (cur && ctx.measureText(test).width > maxWidth) { out.push(cur); cur = chars[i]; }
      else { cur = test; }
    }
    if (cur) out.push(cur);
    return out;
  }

  function drawShareCard(r, sugs) {
    var W = 1080, H = 2600, pad = 90;
    var canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext("2d");
    var FONT = '"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Apple Color Emoji","Segoe UI Emoji",sans-serif';
    function font(size, weight) { ctx.font = (weight ? weight + " " : "") + size + "px " + FONT; }
    function txt(str, x, y, size, weight, color) { font(size, weight); ctx.fillStyle = color; ctx.fillText(str, x, y); }
    function center(str, y, size, weight, color) { font(size, weight); ctx.fillStyle = color; ctx.fillText(str, (W - ctx.measureText(str).width) / 2, y); }
    function divider(y) { ctx.strokeStyle = "#2a1a22"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke(); }
    function block(label, y) { txt(label, pad, y, 28, "600", "#E8B04B"); return y + 52; }
    function wrapped(text, y, size, weight, color) {
      font(size, weight);
      wrapLines(ctx, text, W - pad * 2).forEach(function (ln) { txt(ln, pad, y, size, weight || "400", color); y += size + 16; });
      return y;
    }

    ctx.fillStyle = "#120a0f"; ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = "top";

    var y = 120;
    ctx.fillStyle = "#E0557A"; ctx.fillRect(pad, y, 120, 6); y += 46;
    txt("LOVE & MATCH ADVISOR", pad, y, 28, "500", "#9a7684"); y += 50;
    txt("恋爱择偶建议 💘", pad, y, 60, "700", "#F7EDF0"); y += 92;
    txt(genderLabel(r.gender) + " · " + ageLabel(r.age) + " · " + fmtDateTime(new Date()), pad, y, 30, "400", "#9a7684"); y += 58;
    divider(y); y += 40;

    y = block("你的恋爱人格", y);
    txt(r.attach.seal + "  " + r.attach.name, pad, y, 44, "700", "#F7EDF0"); y += 62;
    txt(r.attach.alias, pad, y, 32, "400", "#E8B04B"); y += 56;
    y = wrapped(r.attach.desc, y, 32, "400", "#cbb4bd"); y += 24;

    y = block("两个关键倾向", y);
    var aL = level3(r.active), sL = level3(r.spend);
    txt("主动度 · " + aL.label + "   (" + r.active + "/6)", pad, y, 34, "400", "#cbb4bd"); y += 50;
    txt("投入度 · " + sL.label + "   (" + r.spend + "/6)", pad, y, 34, "400", "#cbb4bd"); y += 62;

    y = block("给你的建议", y);
    sugs.slice(0, 3).forEach(function (s) {
      font(34, "700"); ctx.fillStyle = "#F7EDF0";
      wrapLines(ctx, s.title, W - pad * 2).forEach(function (ln) { txt(ln, pad, y, 34, "700", "#F7EDF0"); y += 46; });
      y += 4;
      y = wrapped(s.body, y, 30, "400", "#b79aa4"); y += 26;
    });

    divider(y); y += 40;
    center("⚠️ 免责声明：仅供自我了解与娱乐 · 非临床诊断 · 非专业咨询", y, 26, "400", "#7c5a68"); y += 44;
    center("本地生成 · 完全离线 · 不含个人信息", y, 26, "400", "#7c5a68"); y += 60;

    var outH = Math.min(H, y);
    var out = document.createElement("canvas");
    out.width = W; out.height = outH;
    out.getContext("2d").drawImage(canvas, 0, 0, W, outH, 0, 0, W, outH);
    return out;
  }

  /* ========================================================================
     六、工具函数
     ======================================================================== */
  function pad2(n) { return n < 10 ? "0" + n : String(n); }
  function isBlank(v) { return v === undefined || v === null || String(v).trim() === ""; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function fmtDateTime(d) {
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }
  function fileStamp() {
    var d = new Date();
    return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "_" + pad2(d.getHours()) + pad2(d.getMinutes());
  }
  function canSystemShare() {
    return typeof navigator !== "undefined" && !!navigator.share && !!navigator.canShare &&
           typeof File !== "undefined" && typeof Blob !== "undefined";
  }
  function animateBars() {
    var bars = app.querySelectorAll(".meter-fill");
    var run = function () {
      Array.prototype.forEach.call(bars, function (b) {
        var w = b.getAttribute("data-w");
        if (w != null) b.style.width = w + "%";
      });
    };
    if (typeof requestAnimationFrame === "function") requestAnimationFrame(run);
    else run();
  }

  var themeToggle = document.getElementById("themeToggle");
  if (themeToggle) {
    themeToggle.addEventListener("click", function () {
      var isLight = document.body.classList.toggle("light");
      themeToggle.textContent = isLight ? "🌙" : "💡";
    });
  }

  render();
})();
</script>
</body>
